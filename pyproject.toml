[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "task-summarization"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.103.0",
  "pydantic>=2.0.0",
  "uvicorn>=0.23.0",
  "gunicorn>=21.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "httpx>=0.24.0",
]

[tool.setuptools]
packages = ["app"]
